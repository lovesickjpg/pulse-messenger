name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux-${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc
            cxx: g++
          - name: clang
            cxx: clang++
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Bootstrap vcpkg
        run: ./external/vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Configure
        run: cmake --fresh --preset dev-debug -DVCPKG_TARGET_TRIPLET=x64-linux
      - name: Build
        run: cmake --build --preset dev-debug --parallel
      - name: Test protocol and transport
        run: ctest --test-dir build/dev-debug --output-on-failure --no-tests=error
      - name: Check CLI arguments
        run: |
          ./build/dev-debug/bin/pulse-server --help
          ./build/dev-debug/bin/pulse-client --help

  windows:
    name: windows-msvc
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Bootstrap vcpkg
        run: .\external\vcpkg\bootstrap-vcpkg.bat -disableMetrics
      - name: Configure
        run: >-
          cmake -S . -B build/ci-windows -G "Visual Studio 17 2022" -A x64
          "-DCMAKE_TOOLCHAIN_FILE=external/vcpkg/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
      - name: Build
        run: cmake --build build/ci-windows --config Debug --parallel
      - name: Test protocol and transport
        run: ctest --test-dir build/ci-windows -C Debug --output-on-failure --no-tests=error
      - name: Check server arguments
        run: .\build\ci-windows\bin\Debug\pulse-server.exe --help
      - name: Check client arguments
        run: .\build\ci-windows\bin\Debug\pulse-client.exe --help

  formatting:
    name: formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install formatter
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format-18
      - name: Check C++ formatting
        shell: bash
        run: git ls-files -z '*.cpp' '*.hpp' '*.h' | xargs -0 -r clang-format-18 --dry-run --Werror
